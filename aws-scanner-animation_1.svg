<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">AWS Misconfiguration Scanner pipeline</title>
  <desc id="d">A read-only IAM user connects to an AWS account. A Python and boto3 scanner checks S3 public access, IAM MFA and security groups, then writes a severity-ranked JSON report.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="298" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <text x="450" y="30" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">AWS Misconfiguration Scanner</text>
  <text x="450" y="48" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Python + boto3 · read-only access · severity-ranked findings</text>

  <!-- Connectors with flowing dashes -->
  <g fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 6" opacity="0.65">
    <path d="M190,160 L260,160"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M430,160 C465,160 465,95 500,95"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M430,160 L500,160"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M430,160 C465,160 465,225 500,225"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M670,95 C700,95 700,160 730,160"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M670,160 L730,160"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M670,225 C700,225 700,160 730,160"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
  </g>

  <!-- Node 1: AWS account -->
  <g>
    <rect x="40" y="120" width="150" height="80" rx="12" fill="#161b22" stroke="#ff9900" stroke-width="2"/>
    <text x="115" y="152" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ff9900">AWS Account</text>
    <text x="115" y="172" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">ReadOnlyAccess</text>
    <text x="115" y="187" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">IAM user + MFA</text>
  </g>

  <!-- Node 2: scanner -->
  <g>
    <rect x="260" y="120" width="170" height="80" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="345" y="152" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#58a6ff">scanner.py</text>
    <text x="345" y="172" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Python + boto3</text>
    <text x="345" y="187" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">scans 3 services</text>
  </g>

  <!-- Checks -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="500" y="70" width="170" height="50" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <circle cx="526" cy="95" r="12" fill="#d29922" opacity="0.2"/>
    <text x="526" y="99" text-anchor="middle" font-size="11" font-weight="700" fill="#d29922">S3</text>
    <text x="548" y="92" font-size="12" font-weight="600" fill="#e6edf3">Public buckets</text>
    <text x="548" y="108" font-size="10" fill="#8b949e">Block Public Access</text>

    <rect x="500" y="135" width="170" height="50" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="526" cy="160" r="12" fill="#3fb950" opacity="0.2"/>
    <text x="526" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#3fb950">IAM</text>
    <text x="548" y="157" font-size="12" font-weight="600" fill="#e6edf3">Users without MFA</text>
    <text x="548" y="173" font-size="10" fill="#8b949e">Console access check</text>

    <rect x="500" y="200" width="170" height="50" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <circle cx="526" cy="225" r="12" fill="#f85149" opacity="0.2"/>
    <text x="526" y="229" text-anchor="middle" font-size="10" font-weight="700" fill="#f85149">SG</text>
    <text x="548" y="222" font-size="12" font-weight="600" fill="#e6edf3">Open security groups</text>
    <text x="548" y="238" font-size="10" fill="#8b949e">0.0.0.0/0 on 22, 3389</text>
  </g>

  <!-- Node 5: report -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="730" y="110" width="130" height="100" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="795" y="134" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#e6edf3">report.json</text>
    <g font-size="10" font-weight="700" text-anchor="middle">
      <rect x="745" y="146" width="100" height="16" rx="8" fill="#f85149" opacity="0.2"/>
      <text x="795" y="158" fill="#f85149">HIGH
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0s" repeatCount="indefinite"/>
      </text>
      <rect x="745" y="167" width="100" height="16" rx="8" fill="#d29922" opacity="0.2"/>
      <text x="795" y="179" fill="#d29922">MEDIUM
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </text>
      <rect x="745" y="188" width="100" height="16" rx="8" fill="#3fb950" opacity="0.2"/>
      <text x="795" y="200" fill="#3fb950">OK
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Moving data packets -->
  <circle r="5" fill="#ff9900" filter="url(#glow)">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M190,160 L260,160"/>
  </circle>

  <circle r="5" fill="#d29922" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M430,160 C465,160 465,95 500,95"/>
  </circle>
  <circle r="5" fill="#3fb950" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" path="M430,160 L500,160"/>
  </circle>
  <circle r="5" fill="#f85149" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" path="M430,160 C465,160 465,225 500,225"/>
  </circle>

  <circle r="4" fill="#d29922" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="0.3s" repeatCount="indefinite" path="M670,95 C700,95 700,160 730,160"/>
  </circle>
  <circle r="4" fill="#3fb950" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M670,160 L730,160"/>
  </circle>
  <circle r="4" fill="#f85149" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="1.5s" repeatCount="indefinite" path="M670,225 C700,225 700,160 730,160"/>
  </circle>

  <text x="450" y="283" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Least privilege · MFA enforced · secrets never committed</text>
</svg>
