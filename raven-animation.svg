<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Animated RAVEN pipeline: microphone to speech-to-text to AI agent with PiCamera vision to text-to-speech to speaker" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#14122b"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'Courier New', monospace; }
    .title { fill: #a371f7; font-size: 22px; font-weight: bold; letter-spacing: 4px; }
    .sub { fill: #8b949e; font-size: 12px; }
    .label { fill: #e6edf3; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .tag { fill: #8b949e; font-size: 10px; text-anchor: middle; }
    .caption { fill: #8b949e; font-size: 12px; letter-spacing: 4px; text-anchor: middle; }

    .grid line { stroke: #1b2038; stroke-width: 1; }
    .link { stroke: #2b3358; stroke-width: 2; stroke-dasharray: 5 6; animation: dash 1.4s linear infinite; }
    .node { fill: #131a33; stroke: #3b4470; stroke-width: 2; }
    .lit { animation: glow 7s linear infinite; }
    .n1 { animation-delay: -0.5s; }
    .n2 { animation-delay: 1.25s; }
    .n3 { animation-delay: 3s; }
    .n4 { animation-delay: 4.75s; }
    .n5 { animation-delay: 6.5s; }
    .cam { animation: camglow 7s linear infinite; animation-delay: 3s; }

    .packet { fill: #a371f7; animation: travel 7s linear infinite; }
    .campacket { fill: #58a6ff; animation: branch 7s linear infinite; opacity: 0; }

    .bar { fill: #a371f7; transform-box: fill-box; transform-origin: 50% 100%; animation: wave 0.9s ease-in-out infinite; }
    .bar.out { fill: #3fb950; }
    .b1 { animation-delay: 0s; } .b2 { animation-delay: 0.15s; } .b3 { animation-delay: 0.3s; }
    .b4 { animation-delay: 0.45s; } .b5 { animation-delay: 0.6s; } .b6 { animation-delay: 0.75s; } .b7 { animation-delay: 0.9s; }

    .eye { fill: none; stroke: #58a6ff; stroke-width: 2; }
    .pupil { fill: #58a6ff; animation: look 3.5s ease-in-out infinite; }
    .scanline { stroke: #58a6ff; stroke-width: 2; opacity: 0.7; animation: sweep 2.4s ease-in-out infinite; }

    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes glow {
      0% { stroke: #3b4470; }
      3%, 13% { stroke: #a371f7; }
      20%, 100% { stroke: #3b4470; }
    }
    @keyframes camglow {
      0% { stroke: #3b4470; }
      3%, 20% { stroke: #58a6ff; }
      28%, 100% { stroke: #3b4470; }
    }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      3% { opacity: 1; }
      97% { opacity: 1; }
      100% { transform: translateX(720px); opacity: 0; }
    }
    @keyframes branch {
      0%, 48% { opacity: 0; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(0); }
      60% { opacity: 1; transform: translateY(62px); }
      70% { opacity: 1; transform: translateY(0); }
      72%, 100% { opacity: 0; transform: translateY(0); }
    }
    @keyframes wave { 0%, 100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }
    @keyframes look { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
    @keyframes sweep { 0%, 100% { transform: translateY(-5px); } 50% { transform: translateY(5px); } }
  </style>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <g class="grid">
    <line x1="0" y1="75" x2="900" y2="75"/><line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="225" x2="900" y2="225"/>
    <line x1="225" y1="0" x2="225" y2="300"/><line x1="450" y1="0" x2="450" y2="300"/><line x1="675" y1="0" x2="675" y2="300"/>
  </g>

  <text class="title" x="34" y="42">RAVEN</text>
  <text class="sub" x="130" y="42">voice + vision AI assistant on Raspberry Pi</text>

  <!-- links between stages -->
  <line class="link" x1="155" y1="100" x2="205" y2="100"/>
  <line class="link" x1="335" y1="100" x2="385" y2="100"/>
  <line class="link" x1="515" y1="100" x2="565" y2="100"/>
  <line class="link" x1="695" y1="100" x2="745" y2="100"/>
  <line class="link" x1="450" y1="128" x2="450" y2="190"/>

  <!-- stages -->
  <rect class="node lit n1" x="25" y="72" width="130" height="56" rx="12"/>
  <text class="label" x="90" y="97">MIC</text><text class="tag" x="90" y="115">voice input</text>

  <rect class="node lit n2" x="205" y="72" width="130" height="56" rx="12"/>
  <text class="label" x="270" y="97">SPEECH-TO-TEXT</text><text class="tag" x="270" y="115">Groq</text>

  <rect class="node lit n3" x="385" y="72" width="130" height="56" rx="12"/>
  <text class="label" x="450" y="97">AI AGENT</text><text class="tag" x="450" y="115">Gemini</text>

  <rect class="node lit n4" x="565" y="72" width="130" height="56" rx="12"/>
  <text class="label" x="630" y="97">TEXT-TO-SPEECH</text><text class="tag" x="630" y="115">voice output</text>

  <rect class="node lit n5" x="745" y="72" width="130" height="56" rx="12"/>
  <text class="label" x="810" y="97">SPEAKER</text><text class="tag" x="810" y="115">answers aloud</text>

  <!-- camera branch -->
  <rect class="node cam" x="385" y="190" width="130" height="56" rx="12"/>
  <ellipse class="eye" cx="418" cy="218" rx="14" ry="9"/>
  <circle class="pupil" cx="418" cy="218" r="4"/>
  <line class="scanline" x1="404" y1="218" x2="432" y2="218"/>
  <text class="label" x="478" y="214" text-anchor="middle">PiCamera</text>
  <text class="tag" x="478" y="231">OpenCV vision</text>

  <!-- audio waves: input (purple) and output (green) -->
  <g>
    <rect class="bar b1" x="66" y="165" width="6" height="40" rx="3"/>
    <rect class="bar b2" x="76" y="165" width="6" height="40" rx="3"/>
    <rect class="bar b3" x="86" y="165" width="6" height="40" rx="3"/>
    <rect class="bar b4" x="96" y="165" width="6" height="40" rx="3"/>
    <rect class="bar b5" x="106" y="165" width="6" height="40" rx="3"/>
    <rect class="bar b6" x="116" y="165" width="6" height="40" rx="3"/>
    <rect class="bar b7" x="126" y="165" width="6" height="40" rx="3"/>
  </g>
  <g>
    <rect class="bar out b1" x="786" y="165" width="6" height="40" rx="3"/>
    <rect class="bar out b2" x="796" y="165" width="6" height="40" rx="3"/>
    <rect class="bar out b3" x="806" y="165" width="6" height="40" rx="3"/>
    <rect class="bar out b4" x="816" y="165" width="6" height="40" rx="3"/>
    <rect class="bar out b5" x="826" y="165" width="6" height="40" rx="3"/>
    <rect class="bar out b6" x="836" y="165" width="6" height="40" rx="3"/>
    <rect class="bar out b7" x="846" y="165" width="6" height="40" rx="3"/>
  </g>

  <!-- moving data packets -->
  <circle class="packet" cx="90" cy="100" r="7"/>
  <circle class="campacket" cx="450" cy="128" r="5"/>

  <text class="caption" x="450" y="282">LISTEN  ·  SEE  ·  THINK  ·  SPEAK</text>
</svg>
