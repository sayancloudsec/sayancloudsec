<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Animated cloud security diagram: threats blocked by a firewall, legitimate traffic reaching a shielded cloud" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2f81f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'Courier New', monospace; }
    .title { fill: #3fb950; font-size: 15px; }
    .cursor { fill: #3fb950; animation: blink 1s steps(1) infinite; }
    .caption { fill: #8b949e; font-size: 13px; letter-spacing: 3px; }
    .check { fill: #c9d1d9; font-size: 14px; opacity: 0; animation: reveal 6s linear infinite; }
    .check .ok { fill: #3fb950; }
    .c1 { animation-delay: 0s; }
    .c2 { animation-delay: 1s; }
    .c3 { animation-delay: 2s; }
    .c4 { animation-delay: 3s; }

    .grid line { stroke: #1b2740; stroke-width: 1; }
    .lane { stroke: #1f2d4a; stroke-width: 1.5; stroke-dasharray: 4 6; }
    .firewall { stroke: #f0883e; stroke-width: 3; stroke-dasharray: 10 8; animation: dash 1.2s linear infinite; }
    .cloud { fill: #12213b; stroke: #2f81f7; stroke-width: 3; }
    .shield { fill: #0d1117; stroke: #3fb950; stroke-width: 3; }
    .tick { fill: none; stroke: #3fb950; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

    .ring { fill: none; stroke: #3fb950; stroke-width: 2; transform-origin: 450px 135px; animation: pulse 2.6s ease-out infinite; }
    .ring.r2 { animation-delay: 1.3s; }
    .scan { animation: scan 3.2s linear infinite; }

    .threat { fill: #f85149; animation: threat 3s linear infinite; }
    .good { fill: #3fb950; animation: good 3s linear infinite; }
    .t2 { animation-delay: 1s; }
    .t3 { animation-delay: 2s; }
    .g2 { animation-delay: 0.7s; }
    .g3 { animation-delay: 1.7s; }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -18; } }
    @keyframes pulse { 0% { transform: scale(0.55); opacity: 0.8; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes scan { 0% { transform: translateX(-140px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(140px); opacity: 0; } }
    @keyframes threat { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 80% { transform: translateX(262px); opacity: 1; } 100% { transform: translateX(262px); opacity: 0; } }
    @keyframes good { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 85% { transform: translateX(350px); opacity: 1; } 100% { transform: translateX(370px); opacity: 0; } }
    @keyframes reveal { 0%, 4% { opacity: 0; } 10%, 70% { opacity: 1; } 80%, 100% { opacity: 0; } }
  </style>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <g class="grid">
    <line x1="0" y1="65" x2="900" y2="65"/><line x1="0" y1="130" x2="900" y2="130"/><line x1="0" y1="195" x2="900" y2="195"/>
    <line x1="225" y1="0" x2="225" y2="260"/><line x1="450" y1="0" x2="450" y2="260"/><line x1="675" y1="0" x2="675" y2="260"/>
  </g>

  <text class="title" x="34" y="38">$ cloud-security --scan</text>
  <rect class="cursor" x="222" y="25" width="9" height="16"/>

  <!-- traffic lanes -->
  <line class="lane" x1="60" y1="95" x2="440" y2="95"/>
  <line class="lane" x1="60" y1="135" x2="440" y2="135"/>
  <line class="lane" x1="60" y1="175" x2="440" y2="175"/>

  <!-- firewall -->
  <line class="firewall" x1="340" y1="60" x2="340" y2="210"/>
  <text x="340" y="228" text-anchor="middle" fill="#f0883e" font-size="11">FIREWALL / IAM</text>

  <!-- threats (blocked at the firewall) -->
  <circle class="threat" cx="70" cy="95" r="6"/>
  <circle class="threat t2" cx="70" cy="135" r="6"/>
  <circle class="threat t3" cx="70" cy="175" r="6"/>

  <!-- legitimate traffic (reaches the cloud) -->
  <circle class="good g2" cx="70" cy="115" r="5"/>
  <circle class="good g3" cx="70" cy="155" r="5"/>

  <!-- cloud and shield -->
  <circle class="ring" cx="450" cy="135" r="60"/>
  <circle class="ring r2" cx="450" cy="135" r="60"/>
  <path class="cloud" d="M390 170 H520 A35 35 0 0 0 525 100 A50 50 0 0 0 430 90 A40 40 0 0 0 390 170 Z"/>
  <g class="scan"><rect x="446" y="82" width="8" height="96" fill="url(#beam)"/></g>
  <path class="shield" d="M450 105 L478 115 V138 C478 154 465 164 450 170 C435 164 422 154 422 138 V115 Z"/>
  <path class="tick" d="M437 138 L446 147 L464 126"/>

  <!-- status checklist -->
  <g>
    <text class="check c1" x="620" y="95"><tspan class="ok">&#10003;</tspan> IAM least privilege</text>
    <text class="check c2" x="620" y="130"><tspan class="ok">&#10003;</tspan> Encryption at rest</text>
    <text class="check c3" x="620" y="165"><tspan class="ok">&#10003;</tspan> Audit logging on</text>
    <text class="check c4" x="620" y="200"><tspan class="ok">&#10003;</tspan> IaC scanned in CI</text>
  </g>

  <text class="caption" x="450" y="248" text-anchor="middle">DETECT  ·  PROTECT  ·  RESPOND</text>
</svg>
